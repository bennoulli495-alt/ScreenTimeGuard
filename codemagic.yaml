workflows:
  screen-time-guard:
    name: Screen Time Guard
    max_build_duration: 30
    environment:
      vars:
        PACKAGE_NAME: "com.familyguard.screentime"
      java: 17
    scripts:
      - name: Reorganize files uploaded flat via GitHub web UI
        script: |
          #!/usr/bin/env bash
          set -e

          # If the repo already has a proper app/ folder with build.gradle,
          # the project was pushed with structure intact (e.g. via git CLI
          # or a folder drag-and-drop) and no reorganization is needed.
          if [ -f "app/build.gradle" ]; then
            echo "Project structure already intact, skipping reorganization."
            exit 0
          fi

          echo "Flat upload detected - reconstructing project structure..."

          mkdir -p app/src/main/java/com/familyguard/screentime/{util,data,receiver,scheduler,service,ui}
          mkdir -p app/src/main/res/{values,xml,layout,drawable,mipmap-anydpi-v26}

          # Picks the highest-numbered "Name (n).ext" duplicate created by
          # GitHub's web upload when a file is re-uploaded, falling back to
          # the plain filename if no duplicates exist.
          latest_variant() {
            local base="$1"
            local dir="${base%/*}"
            local file="${base##*/}"
            local name="${file%.*}"
            local ext="${file##*.}"
            local best="$file"
            local best_n=0
            for f in "$name" "$name (1).$ext" "$name (2).$ext" "$name (3).$ext" \
                     "$name (4).$ext" "$name (5).$ext"; do
              if [ -f "$f" ]; then
                n=$(echo "$f" | grep -oP '(?<=\()\d+(?=\))' || echo 0)
                if [ "$n" -ge "$best_n" ]; then
                  best="$f"; best_n="$n"
                fi
              fi
            done
            echo "$best"
          }

          move() {
            local pattern="$1"
            local dest="$2"
            local src
            src=$(latest_variant "$pattern")
            if [ -f "$src" ]; then
              cp "$src" "$dest"
              echo "Moved $src -> $dest"
            fi
          }

          JAVA_DIR="app/src/main/java/com/familyguard/screentime"
          RES_DIR="app/src/main/res"

          move "AndroidManifest.xml" "app/src/main/AndroidManifest.xml"
          move "App.kt" "$JAVA_DIR/App.kt"
          move "Constants.kt" "$JAVA_DIR/util/Constants.kt"
          move "PasswordUtils.kt" "$JAVA_DIR/util/PasswordUtils.kt"
          move "PreferenceStorage.kt" "$JAVA_DIR/data/PreferenceStorage.kt"
          move "AppRepository.kt" "$JAVA_DIR/data/AppRepository.kt"
          move "AppInfo.kt" "$JAVA_DIR/data/AppInfo.kt"
          move "MyDeviceAdminReceiver.kt" "$JAVA_DIR/receiver/MyDeviceAdminReceiver.kt"
          move "BootReceiver.kt" "$JAVA_DIR/receiver/BootReceiver.kt"
          move "DailyResetReceiver.kt" "$JAVA_DIR/receiver/DailyResetReceiver.kt"
          move "AlarmScheduler.kt" "$JAVA_DIR/scheduler/AlarmScheduler.kt"
          move "AppMonitorService.kt" "$JAVA_DIR/service/AppMonitorService.kt"
          move "LockScreenOverlayManager.kt" "$JAVA_DIR/service/LockScreenOverlayManager.kt"
          move "SettingsActivity.kt" "$JAVA_DIR/ui/SettingsActivity.kt"
          move "SettingsViewModel.kt" "$JAVA_DIR/ui/SettingsViewModel.kt"
          move "AppListAdapter.kt" "$JAVA_DIR/ui/AppListAdapter.kt"

          move "strings.xml" "$RES_DIR/values/strings.xml"
          move "colors.xml" "$RES_DIR/values/colors.xml"
          move "themes.xml" "$RES_DIR/values/themes.xml"
          move "device_admin_receiver.xml" "$RES_DIR/xml/device_admin_receiver.xml"
          move "activity_settings.xml" "$RES_DIR/layout/activity_settings.xml"
          move "overlay_lock_screen.xml" "$RES_DIR/layout/overlay_lock_screen.xml"
          move "item_app.xml" "$RES_DIR/layout/item_app.xml"
          move "ic_launcher_background.xml" "$RES_DIR/drawable/ic_launcher_background.xml"
          move "ic_launcher_foreground.xml" "$RES_DIR/drawable/ic_launcher_foreground.xml"
          move "ic_launcher.xml" "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"

          move "build.gradle" "app/build.gradle" # app-level; overwritten below if root also flat
          move "settings.gradle" "settings.gradle"
          move "gradle.properties" "gradle.properties"
          move "proguard-rules.pro" "app/proguard-rules.pro"

      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Generate Gradle wrapper if missing
        script: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
