workflows:
  screen-time-guard:
    name: Screen Time Guard
    max_build_duration: 30
    environment:
      vars:
        PACKAGE_NAME: "com.familyguard.screentime"
      java: 17
    scripts:
      - name: Reorganize files uploaded flat via GitHub web UI
        script: |
          #!/usr/bin/env bash
          set -e

          # NOTE: this reorganization step always runs (it does not exit
          # early even when app/build.gradle already exists), so any newly
          # uploaded file dropped flat at the repo root — via GitHub's
          # drag-and-drop "Upload files" — is picked up and relocated on
          # every build, not just the first one. The move() function below
          # is safe to re-run: it skips a file that is already sitting in
          # its correct destination.
          echo "Reconciling project structure..."

          mkdir -p app/src/main/java/com/familyguard/screentime/{util,data,receiver,scheduler,service,ui}
          mkdir -p app/src/main/res/{values,xml,layout,drawable,mipmap-anydpi-v26}

          # Picks the highest-numbered "Name (n).ext" duplicate created by
          # GitHub's web upload when a file is re-uploaded, falling back to
          # the plain filename if no duplicates exist. Uses sed instead of
          # "grep -P" because Codemagic's macOS build agents ship BSD grep,
          # which does not support Perl-style regex.
          latest_variant() {
            local file="${1##*/}"
            local name="${file%.*}"
            local ext="${file##*.}"
            local best="$file"
            local best_n=0
            for f in "$file" "$name (1).$ext" "$name (2).$ext" "$name (3).$ext" \
                     "$name (4).$ext" "$name (5).$ext"; do
              if [ -f "$f" ]; then
                n=$(echo "$f" | sed -E 's/.*\(([0-9]+)\).*/\1/')
                case "$n" in
                  ''|*[!0-9]*) n=0 ;;
                esac
                if [ "$n" -ge "$best_n" ]; then
                  best="$f"; best_n="$n"
                fi
              fi
            done
            echo "$best"
          }

          move() {
            local pattern="$1"
            local dest="$2"
            local src
            src=$(latest_variant "$pattern")
            if [ ! -f "$src" ]; then
              return
            fi
            if [ "$src" = "$dest" ]; then
              echo "$src already in place, skipping"
              return
            fi
            mkdir -p "$(dirname "$dest")"
            cp "$src" "$dest"
            echo "Moved $src -> $dest"
          }

          JAVA_DIR="app/src/main/java/com/familyguard/screentime"
          RES_DIR="app/src/main/res"

          move "AndroidManifest.xml" "app/src/main/AndroidManifest.xml"
          move "App.kt" "$JAVA_DIR/App.kt"
          move "Constants.kt" "$JAVA_DIR/util/Constants.kt"
          move "PasswordUtils.kt" "$JAVA_DIR/util/PasswordUtils.kt"
          move "PreferenceStorage.kt" "$JAVA_DIR/data/PreferenceStorage.kt"
          move "AppRepository.kt" "$JAVA_DIR/data/AppRepository.kt"
          move "AppInfo.kt" "$JAVA_DIR/data/AppInfo.kt"
          move "MyDeviceAdminReceiver.kt" "$JAVA_DIR/receiver/MyDeviceAdminReceiver.kt"
          move "BootReceiver.kt" "$JAVA_DIR/receiver/BootReceiver.kt"
          move "DailyResetReceiver.kt" "$JAVA_DIR/receiver/DailyResetReceiver.kt"
          move "AlarmScheduler.kt" "$JAVA_DIR/scheduler/AlarmScheduler.kt"
          move "AppMonitorService.kt" "$JAVA_DIR/service/AppMonitorService.kt"
          move "LockScreenOverlayManager.kt" "$JAVA_DIR/service/LockScreenOverlayManager.kt"
          move "SettingsActivity.kt" "$JAVA_DIR/ui/SettingsActivity.kt"
          move "SettingsViewModel.kt" "$JAVA_DIR/ui/SettingsViewModel.kt"
          move "AppListAdapter.kt" "$JAVA_DIR/ui/AppListAdapter.kt"
          move "AppSelectionActivity.kt" "$JAVA_DIR/ui/AppSelectionActivity.kt"
          move "PasswordActivity.kt" "$JAVA_DIR/ui/PasswordActivity.kt"
          move "RecoveryQuestionActivity.kt" "$JAVA_DIR/ui/RecoveryQuestionActivity.kt"

          move "strings.xml" "$RES_DIR/values/strings.xml"
          move "colors.xml" "$RES_DIR/values/colors.xml"
          move "themes.xml" "$RES_DIR/values/themes.xml"
          move "device_admin_receiver.xml" "$RES_DIR/xml/device_admin_receiver.xml"
          move "activity_settings.xml" "$RES_DIR/layout/activity_settings.xml"
          move "overlay_lock_screen.xml" "$RES_DIR/layout/overlay_lock_screen.xml"
          move "item_app.xml" "$RES_DIR/layout/item_app.xml"
          move "activity_app_selection.xml" "$RES_DIR/layout/activity_app_selection.xml"
          move "activity_password.xml" "$RES_DIR/layout/activity_password.xml"
          move "activity_recovery_question.xml" "$RES_DIR/layout/activity_recovery_question.xml"
          move "ic_launcher_background.xml" "$RES_DIR/drawable/ic_launcher_background.xml"
          move "ic_launcher_foreground.xml" "$RES_DIR/drawable/ic_launcher_foreground.xml"
          move "ic_launcher.xml" "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"

          # build.gradle is a special case: identical filenames exist at the
          # repo root (project-level) and inside app/ (module-level). Only
          # attempt to relocate a root-level duplicate into app/build.gradle
          # the first time app/build.gradle doesn't exist yet — once it's in
          # place, re-running this on every build must NOT overwrite it with
          # whichever "build.gradle" happens to still be sitting at root.
          if [ ! -f "app/build.gradle" ]; then
            move "build.gradle" "app/build.gradle"
          fi
          move "settings.gradle" "settings.gradle"
          move "gradle.properties" "gradle.properties"
          move "proguard-rules.pro" "app/proguard-rules.pro"

      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Generate Gradle wrapper if missing
        script: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
